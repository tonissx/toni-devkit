name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - id: compute
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/compute-version.mjs >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Cliente OAuth do Google (sincronização com o Drive): segredos do repositório → arquivo gerado, empacotado no
      # instalador. Sem os segredos o passo só avisa e o app pede ao usuário as credenciais dele.
      - name: Embute o cliente OAuth do Google
        env:
          DEVKIT_GOOGLE_CLIENT_ID: ${{ secrets.DEVKIT_GOOGLE_CLIENT_ID }}
          DEVKIT_GOOGLE_CLIENT_SECRET: ${{ secrets.DEVKIT_GOOGLE_CLIENT_SECRET }}
        run: node scripts/embed-google-client.mjs
      - run: npx electron-builder ${{ matrix.args }} --publish always --config.extraMetadata.version=${{ needs.version.outputs.version }}

  # Checksums + atestado de procedência (SLSA) dos instaladores, para quem quiser verificar o download.
  # Verificação: `gh attestation verify <arquivo> -R tonissx/toni-devkit` e `SHA256SUMS.txt` na página da release.
  verify-assets:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - name: Baixa os instaladores da release
        run: |
          mkdir assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets \
            --pattern '*.exe' --pattern '*.dmg' --pattern '*.AppImage'
          ls -l assets
      - name: Gera o SHA256SUMS.txt
        working-directory: assets
        run: sha256sum * > ../SHA256SUMS.txt && cat ../SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: assets/*
      - name: Anexa o SHA256SUMS.txt à release
        run: gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
